# Docker Compose for local development
# Provides PostgreSQL and Redis for local testing

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jobscout-postgres
    environment:
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout_dev
      POSTGRES_DB: jobscout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jobscout-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

# Usage:
# Start:   docker-compose up -d
# Stop:    docker-compose down
# Logs:    docker-compose logs -f
# Reset:   docker-compose down -v (removes data)

# Connection strings for .env.local:
# DATABASE_URL="postgresql://jobscout:jobscout_dev@localhost:5432/jobscout"
# REDIS_URL="redis://localhost:6379"
